name: Expand company list

# Weekly (started Mondays 06:00 UTC by the Cloudflare Worker's "0 6 * * 1" cron through the
# workflow_dispatch API, because GitHub's own `schedule` trigger is unreliable), or by hand.
# Demotes fast-tier companies without a match in 30 days to the wide tier, then probes public
# board lists and adds every live board not yet watched: boards with a currently matching role as
# 'fast' (checked every 10 min), the rest as 'wide' (checked hourly). New companies are baselined
# silently by the poller (400 per run). Shares the poller's concurrency group so the two never overlap.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only report what would be demoted and added
        type: boolean
        default: false
      target_total:
        description: Optional cap on total active companies (blank = add every live board)
        type: string
        required: false
        default: ""

concurrency:
  group: poll
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run expand -- ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          # Raises the GitHub API rate limit for listing the source repos.
          GITHUB_TOKEN: ${{ github.token }}
          EXPAND_TARGET_TOTAL: ${{ inputs.target_total }}
          EXPAND_DRY_RUN: ${{ inputs.dry_run }}
          EXPAND_TIME_BUDGET_MIN: 30
