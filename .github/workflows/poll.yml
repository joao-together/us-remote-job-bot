name: Poll job boards

on:
  schedule:
    # Every 10 minutes, offset from :00 where GitHub delays or drops runs.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

concurrency:
  group: poll
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # keepalive step re-enables this workflow

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run poll
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_USER_ID: ${{ secrets.OWNER_USER_ID }}
      # GitHub disables scheduled workflows in public repos after 60 days without commits;
      # re-enabling from a run resets that timer.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        run: gh workflow enable poll.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
