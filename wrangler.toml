name = "us-remote-job-bot"
main = "src/worker/index.ts"
compatibility_date = "2026-08-15"
workers_dev = true
preview_urls = false

# "*/10": starts the GitHub Actions poller (GitHub's own scheduler is unreliable).
# "43 * * * *": hourly watchdog that warns if polling stops succeeding.
# "0 6 * * 1": weekly (Monday 06:00 UTC) start of the "Expand company list" workflow.
# The free plan allows up to 5 cron triggers per Worker.
[triggers]
crons = ["*/10 * * * *", "43 * * * *", "0 6 * * 1"]

[[d1_databases]]
binding = "DB"
database_name = "jobbot"
# Replace with the id printed by `wrangler d1 create jobbot`.
database_id = "d0501276-dc48-4b2b-8a0a-89a33508cf38"
migrations_dir = "migrations"

# Secrets (set with `wrangler secret put`):
#   TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET, OWNER_USER_ID

[vars]
GITHUB_REPO = "joao-together/us-remote-job-bot"
# Secret (wrangler secret put): GITHUB_DISPATCH_TOKEN — fine-grained token, this repo only, Actions: write.
